<html style="margin:0;padding:0">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;overflow-x:hidden;cursor:none}

body{

  font-family:'Cormorant Garamond',serif;
  position:relative
}
body::after{

  background-image:
    radial-gradient(circle 1px at 20% 30%, #000 50%, transparent 51%),
    radial-gradient(circle 1px at 70% 60%, #000 50%, transparent 51%),
    radial-gradient(circle 1.5px at 40% 80%, #000 50%, transparent 51%),
    radial-gradient(circle 1px at 85% 15%, #000 50%, transparent 51%);

  z-index:1
}

#cursor{position:fixed;width:26px;height:26px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);font-size:24px;transition:transform .1s}
#brilho{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,220,160,.18),transparent 65%);pointer-events:none;z-index:2;transform:translate(-50%,-50%);transition:all .25s ease}

.titulo-caixa{
  position:relative;z-index:5;text-align:center;padding:35px 20px 10px;color:#f5e6d3;
  text-shadow:0 4px 20px rgba(0,0,0,.7)
}
.titulo-caixa h1{font-family:'Caveat',cursive;font-size:clamp(34px,6.5vw,68px);font-weight:700;color:#ffe4b8;line-height:1}
.titulo-caixa p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(17px,2.3vw,23px);color:#d4b896;margin-top:8px;opacity:.95;max-width:780px;margin-left:auto;margin-right:auto}
.subtitulo{
  position:relative;z-index:5;text-align:center;color:#c9a87c;font-family:'Special Elite',cursive;
  font-size:13px;letter-spacing:3px;margin-bottom:20px;opacity:.85
}

.area-caixa{
  position:relative;z-index:5;width:100%;min-height:540px;
  display:flex;justify-content:center;align-items:center;padding:20px;
  perspective:1800px
}
.caixa{
  position:relative;width:min(460px,90vw);aspect-ratio:4/3;transform-style:preserve-3d;
  transition:transform .8s ease
}
.caixa.aberta{transform:translateY(-30px)}

.corpo{
  position:absolute;inset:10% 0 0 0;border-radius:8px;
  background:
    repeating-linear-gradient(90deg,
      #6b3410 0px,#8b4513 3px,#7a3c12 6px,#9a4a15 10px,#6b3410 14px),
    linear-gradient(180deg,#8b4513,#5a2a0c);
  box-shadow:
    inset 0 15px 30px rgba(0,0,0,.5),
    inset 0 -5px 15px rgba(0,0,0,.4),
    0 30px 60px rgba(0,0,0,.6),
    0 0 0 2px #3d1f08;
  overflow:hidden
}
.corpo::before{
  content:'';position:absolute;inset:8px;border:2px solid rgba(255,215,150,.25);border-radius:4px;pointer-events:none
}
.dentro-caixa{
  position:absolute;inset:12px;border-radius:4px;
  background:
    radial-gradient(ellipse at center,#2a1208 0%,#1a0a04 100%);
  box-shadow:inset 0 10px 40px rgba(0,0,0,.8)
}

.tampa{
  position:absolute;inset:0 0 30% 0;transform-origin:bottom center;transform-style:preserve-3d;
  transition:transform 1.2s cubic-bezier(.68,-.55,.265,1.55);
  border-radius:8px 8px 4px 4px;
  background:
    repeating-linear-gradient(90deg,
      #7a3c12 0px,#9a4a15 3px,#8b4513 6px,#a85218 10px,#7a3c12 14px),
    linear-gradient(180deg,#a85218,#6b3410);
  box-shadow:
    inset 0 8px 20px rgba(255,220,170,.2),
    inset 0 -5px 15px rgba(0,0,0,.4),
    0 15px 40px rgba(0,0,0,.5),
    0 0 0 2px #3d1f08;
  z-index:10
}
.tampa::before{
  content:'';position:absolute;inset:8px;border:2px solid rgba(255,215,150,.3);border-radius:4px
}
.tampa::after{
  content:'💌';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:56px;opacity:.85;text-shadow:0 2px 8px rgba(0,0,0,.5)
}
.caixa.aberta .tampa{transform:rotateX(-125deg)}

.laco-horizontal,.laco-vertical{
  position:absolute;background:linear-gradient(90deg,#8b0a0a,#c91818 50%,#8b0a0a);
  box-shadow:0 2px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.2);
  pointer-events:none;transition:opacity .5s ease
}
.laco-horizontal{left:0;right:0;top:45%;height:40px;z-index:15}
.laco-vertical{top:0;bottom:0;left:50%;width:40px;transform:translateX(-50%);z-index:15}
.no-laco{
  position:absolute;top:calc(45% - 34px);left:50%;transform:translateX(-50%);
  width:100px;height:78px;z-index:20;pointer-events:none;transition:opacity .5s ease
}
.no-laco::before,.no-laco::after{
  content:'';position:absolute;top:10px;width:62px;height:58px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  background:radial-gradient(ellipse at 30% 30%,#ff3030,#8b0a0a);
  box-shadow:inset -5px -8px 15px rgba(0,0,0,.4), 0 4px 10px rgba(0,0,0,.3)
}
.no-laco::before{left:-34px;transform:rotate(-20deg)}
.no-laco::after{right:-34px;transform:rotate(20deg)}
.no-laco span{
  position:absolute;top:24px;left:50%;transform:translateX(-50%);
  width:26px;height:34px;background:linear-gradient(90deg,#a01010,#c91818,#a01010);
  border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.4)
}
.caixa.aberta .laco-horizontal,
.caixa.aberta .laco-vertical,
.caixa.aberta .no-laco{opacity:0;pointer-events:none}

.clique-abrir{
  position:absolute;bottom:-55px;left:50%;transform:translateX(-50%);
  color:#ffe4b8;font-family:'Caveat',cursive;font-size:28px;white-space:nowrap;
  text-shadow:0 2px 10px rgba(0,0,0,.8);animation:piscar 1.8s ease-in-out infinite;z-index:20
}
@keyframes piscar{0%,100%{opacity:.5}50%{opacity:1}}
.caixa.aberta .clique-abrir{display:none}

.itens-memorias{
  position:fixed;inset:0;pointer-events:none;z-index:50
}
.item{
  position:absolute;pointer-events:auto;cursor:pointer;
  transition:transform .6s cubic-bezier(.34,1.56,.64,1), opacity .5s ease, box-shadow .3s ease;
  transform-origin:center center;opacity:0;
  filter:drop-shadow(0 8px 15px rgba(0,0,0,.5))
}
.item.visivel{opacity:1}
.item:hover{transform:scale(1.18) rotate(0deg) !important;z-index:100 !important;filter:drop-shadow(0 15px 30px rgba(0,0,0,.65))}
.item .face-item{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(32px,7vw,56px)
}
.item .legenda-item{
  position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-family:'Caveat',cursive;font-size:17px;color:#ffe4b8;
  text-shadow:0 1px 4px rgba(0,0,0,.9);opacity:0;transition:opacity .2s
}
.item:hover .legenda-item{opacity:1}

.papel{background:#f5ecd7;box-shadow:inset 0 0 30px rgba(139,90,43,.2), 0 0 0 1px rgba(139,90,43,.15)}
.papel::after{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.4;
  background:
    radial-gradient(ellipse 80px 50px at 80% 20%, rgba(139,90,43,.18), transparent 70%),
    radial-gradient(ellipse 40px 30px at 15% 75%, rgba(139,90,43,.12), transparent 70%)
}
.coracao{background:transparent;display:flex;align-items:center;justify-content:center}
.estrela{background:transparent;display:flex;align-items:center;justify-content:center}
.papelzinho{background:#faf5e8;border:1px solid rgba(139,90,43,.2);box-shadow:inset 0 0 40px rgba(139,90,43,.08)}
.listinha{background:#fff9c4;box-shadow:inset 0 0 20px rgba(200,170,50,.1), 2px 4px 12px rgba(0,0,0,.3)}
.lua{background:radial-gradient(circle,rgba(139,90,43,.1),transparent 70%),#f5ecd7;border-radius:50%;display:flex;align-items:center;justify-content:center}
.promessa{background:linear-gradient(135deg,#e8d4b0,#c9a876);border:1px solid rgba(139,90,43,.3)}
.carta-longa{background:#f5ecd7;box-shadow:inset 0 0 40px rgba(139,90,43,.15)}
.relogio{background:transparent;display:flex;align-items:center;justify-content:center}
.certeza{background:radial-gradient(circle at 30% 30%,#ffcdd2,#ef9a9a,#c62828);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset -6px -8px 15px rgba(0,0,0,.3)}

.modal-item{
  position:fixed;inset:0;background:rgba(10,5,2,.88);backdrop-filter:blur(10px);
  z-index:500;display:none;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .4s ease
}
.modal-item.aberto{display:flex}
.papel-modal{
  position:relative;width:min(720px,97%);max-height:90vh;overflow-y:auto;
  background:#f5ecd7;padding:55px 42px;border-radius:4px;
  box-shadow:
    0 30px 90px rgba(0,0,0,.75),
    inset 0 0 60px rgba(139,90,43,.18),
    inset 0 0 0 1px rgba(139,90,43,.2);
  animation:abrirPapel .6s cubic-bezier(.34,1.56,.64,1)
}
.papel-modal::before{
  content:'';position:absolute;inset:14px;border:1px solid rgba(139,90,43,.28);border-radius:2px;pointer-events:none
}
.fechar-item{
  position:absolute;top:14px;right:18px;background:none;border:none;
  font-size:38px;color:#8b5a2b;cursor:pointer;opacity:.5;transition:all .2s;
  font-family:sans-serif;line-height:1
}
.fechar-item:hover{opacity:1;transform:rotate(90deg) scale(1.2);color:#8b1a1a}
.titulo-item{
  font-family:'Caveat',cursive;font-size:clamp(30px,5.5vw,52px);color:#8b1a1a;
  text-align:center;margin-bottom:15px;line-height:1.1
}
.divisor-item{
  width:140px;height:2px;background:linear-gradient(90deg,transparent,#b8860b,transparent);
  margin:0 auto 22px
}
.conteudo-item{
  font-family:'Cormorant Garamond',serif;font-size:clamp(20px,2.8vw,28px);
  line-height:1.6;color:#3a2418;text-align:center
}
.conteudo-item p{margin-bottom:12px}
.manuscrito{font-family:'Caveat',cursive;color:#5c3a21;font-size:clamp(22px,3.2vw,34px);line-height:1.25}
.linhas-papel{
  background-image:repeating-linear-gradient(to bottom,transparent 0 36px,rgba(139,90,43,.22) 36px 37px);
  padding-top:7px
}

.voltar-caixa{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:60;background:linear-gradient(145deg,#8b4513,#5a2a0c);color:#ffe4b8;
  border:none;padding:14px 30px;border-radius:50px;cursor:pointer;
  font-family:'Caveat',cursive;font-size:23px;box-shadow:0 8px 28px rgba(0,0,0,.55);
  transition:all .25s ease;display:none
}
.voltar-caixa:hover{transform:translateX(-50%) scale(1.07);box-shadow:0 12px 38px rgba(0,0,0,.65)}
.voltar-caixa.visivel{display:block}

.coracao-flutuante{
  position:fixed;pointer-events:none;z-index:10;
  animation:subir 6s ease-out forwards;
  font-size:22px;opacity:0
}
@keyframes subir{
  0%{transform:translateY(0) scale(.5);opacity:0}
  15%{opacity:.85}
  100%{transform:translateY(-130vh) rotate(360deg) scale(1.3);opacity:0}
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes abrirPapel{from{opacity:0;transform:scale(.6) rotate(-5deg)}to{opacity:1;transform:scale(1) rotate(0)}}

.papel-modal::-webkit-scrollbar{width:7px}
.papel-modal::-webkit-scrollbar-thumb{background:linear-gradient(#8b5a2b,#b8860b);border-radius:3px}

@media(max-width:700px){
  .item{transform:scale(.88) !important}
  .item:hover{transform:scale(1.05) rotate(0deg) !important}
  .papel-modal{padding:45px 26px}
}
</style>

<div id="cursor">💖</div>
<div id="brilho"></div>

<div class="titulo-caixa">

        são milhares de sorrisos assim,<br>

  },
  {
    id:'noites',icone:'🌙',formato:'lua',largura:105,altura:105,rot:8,

    conteudo:`
      <div style="font-size:90px;margin:12px 0;opacity:.95">🌙⭐</div>

const cursor = document.getElementById('cursor');
const brilho = document.getElementById('brilho');
document.addEventListener('mousemove',e=>{
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
  brilho.style.left = e.clientX + 'px';
  brilho.style.top = e.clientY + 'px';
});
document.addEventListener('mousedown',()=>cursor.style.transform='translate(-50%,-50%) scale(1.8)');
document.addEventListener('mouseup',()=>cursor.style.transform='translate(-50%,-50%) scale(1)');

const caixa = document.getElementById('caixa');
const containerItens = document.getElementById('itens');
const btnVoltar = document.getElementById('voltarCaixa');
let aberta = false;

function posicoesItens(){
  const w = window.innerWidth, h = window.innerHeight;
  const centroX = w/2, centroY = h/2;
  const raio = Math.min(w,h) * 0.4;
  return ITENS.map((item,i)=>{
    const angulo = (i / ITENS.length) * Math.PI * 2 - Math.PI/2 + (Math.random()-.5)*0.3;
    const r = raio * (0.75 + Math.random()*0.35);
    return {
      x: centroX + Math.cos(angulo) * r - item.largura/2,
      y: centroY + Math.sin(angulo) * r - item.altura/2 + (Math.random()-.5)*40
    };
  });
}

function abrirCaixa(){
  if(aberta) return;
  aberta = true;
  caixa.classList.add('aberta');
  for(let i=0;i<28;i++){
    setTimeout(()=>{
      const c = document.createElement('div');
      c.className = 'coracao-flutuante';
      c.textContent = ['💖','✨','💗','💕','⭐'][Math.floor(Math.random()*5)];
      c.style.left = (window.innerWidth/2 + (Math.random()-.5)*220) + 'px';
      c.style.top = (window.innerHeight*0.55) + 'px';
      c.style.animationDelay = (Math.random()*.5) + 's';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),6500);
    },i*55);
  }
  const pos = posicoesItens();
  containerItens.innerHTML = '';
  ITENS.forEach((item,i)=>{
    const el = document.createElement('div');
    el.className = `item ${item.formato}`;
    el.style.width = item.largura + 'px';
    el.style.height = item.altura + 'px';
    el.style.left = (window.innerWidth/2 - item.largura/2) + 'px';
    el.style.top = (window.innerHeight*0.45) + 'px';
    el.style.zIndex = 10 + i;
    el.innerHTML = `
      <div class="face-item">${item.icone}</div>
      <div class="legenda-item">${item.titulo.replace(/^.{1,5}/,'')}</div>
    `;
    el.addEventListener('click',()=>abrirItem(item));
    containerItens.appendChild(el);
    setTimeout(()=>{
      el.classList.add('visivel');
      el.style.left = pos[i].x + 'px';
      el.style.top = pos[i].y + 'px';
      el.style.transform = `rotate(${item.rot + (Math.random()-.5)*10}deg)`;
    }, 400 + i*90);
  });
  setTimeout(()=>btnVoltar.classList.add('visivel'), 1500);
}

function fecharCaixa(){
  aberta = false;
  caixa.classList.remove('aberta');
  btnVoltar.classList.remove('visivel');
  const centroX = window.innerWidth/2, centroY = window.innerHeight*0.45;
  document.querySelectorAll('.item').forEach((el,i)=>{
    el.classList.remove('visivel');
    el.style.left = (centroX - el.offsetWidth/2) + 'px';
    el.style.top = centroY + 'px';
    el.style.transform = 'rotate(0) scale(.3)';
    setTimeout(()=>el.remove(),700);
  });
}

caixa.addEventListener('click',abrirCaixa);
btnVoltar.addEventListener('click',fecharCaixa);

const modal = document.getElementById('modal');
const tituloItem = document.getElementById('tituloItem');
const conteudoItem = document.getElementById('conteudoItem');
const fecharItem = document.getElementById('fecharItem');

function abrirItem(item){
  tituloItem.textContent = item.titulo;
  conteudoItem.innerHTML = item.conteudo;
  modal.classList.add('aberto');
  for(let i=0;i<10;i++){
    setTimeout(()=>{
      const c = document.createElement('div');
      c.className = 'coracao-flutuante';
      c.textContent = ['💖','💕','✨'][Math.floor(Math.random()*3)];
      c.style.left = (Math.random()*window.innerWidth) + 'px';
      c.style.top = window.innerHeight + 'px';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),6500);
    },i*90);
  }
}

fecharItem.onclick = ()=>modal.classList.remove('aberto');
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('aberto')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('aberto')});

let redimTimeout;
window.addEventListener('resize',()=>{
  if(!aberta) return;
  clearTimeout(redimTimeout);
  redimTimeout = setTimeout(()=>{
    const pos = posicoesItens();
    document.querySelectorAll('.item').forEach((el,i)=>{
      if(pos[i]){el.style.left = pos[i].x + 'px';el.style.top = pos[i].y + 'px'}
    });
  },200);
});
</script>
</html>
